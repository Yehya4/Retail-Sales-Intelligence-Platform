[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
markers =
    slow: Tests lents (nécessitent PySpark ou PostgreSQL)
    integration: Tests d'intégration (nécessitent une base de données)
    unit: Tests unitaires rapides
